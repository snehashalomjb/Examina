services:
  - type: web
    name: examina-backend
    env: python
    buildCommand: uv pip install -e ".[openai]"
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: standard
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "AI-Based Intelligent Examination Platform"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: examina-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: exam-media
      - key: GRADER_PROVIDER
        value: stub
      - key: OCR_ENABLED
        value: "true"

databases:
  - name: examina-postgres
    plan: standard
    databaseName: examdb
    user: exam
