services:
  - type: web
    name: examina-backend
    env: python
    rootDir: backend
    buildCommand: pip install -e ".[openai]"
    preDeployCommand: python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: standard
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "AI-Based Intelligent Examination Platform"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: examina-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "https://examina-1.vercel.app,https://examina-1-git-main-snehashalomjb-9684s-projects.vercel.app,https://examina-1.snehashalomjb-9684s-projects.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: exam-media
      - key: GRADER_PROVIDER
        value: stub
      - key: OCR_ENABLED
        value: "true"

databases:
  - name: examina-postgres
    plan: standard
    databaseName: examdb
    user: exam
