[project]
name = "exam-platform-backend"
version = "0.1.0"
description = "FastAPI backend for the AI-Based Intelligent Examination Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.12",
    "boto3>=1.35.0",
    "email-validator>=2.2.0",
    "apscheduler>=3.10.4",
    "pillow>=11.0.0",
    "pytesseract>=0.3.13",
    "reportlab>=4.0.0",
    "pypdf>=6.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]
claude = [
    "anthropic>=0.40.0",
]
openai = [
    "openai>=1.60.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI dependencies are declared as call defaults by design.
# UP042: `str, Enum` is kept over `StrEnum` - it is what SQLAlchemy's Enum(...)
#        and Pydantic both consume most predictably across versions.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["E501"]
# Autogenerated migrations keep Alembic's own long single-line call style. They are
# read as a historical record, not maintained as source.
"alembic/versions/*" = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]
